<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>       
      <a-entity light="type: ambient; intensity: 1.0"></a-entity>
      <a-entity light="type: directional; intensity: 1.5" position="1 1 1"></a-entity>
      <a-assets>
        <!-- 1. 定義模型 definite models-->
        <a-asset-item id="snow" src="assets/snow.glb"></a-asset-item>
        <a-asset-item id="horse" src="assets/horse.glb"></a-asset-item>
        <a-asset-item id="frozen" src="assets/frozen.glb"></a-asset-item>
        <a-asset-item id="forest" src="assets/forest.glb"></a-asset-item>
        <a-asset-item id="sky" src="assets/sky.glb"></a-asset-item>
        <a-asset-item id="village" src="assets/village.glb"></a-asset-item>
        <a-asset-item id="lake" src="assets/lake.glb"></a-asset-item>
        <a-asset-item id="lake2" src="assets/lake2.glb"></a-asset-item>
      </a-assets>  
  
      <!-- 2.1 場景snow -->
      <a-entity gltf-model="#snow" position="0 -5 -7" scale="0.01 0.01 0.01" ></a-entity>
      <a-entity gltf-model="#snow" position="0 -5 -100" scale="0.01 0.01 0.01" ></a-entity>
      <a-entity gltf-model="#snow" position="0 -5 100" scale="0.01 0.01 0.01" ></a-entity>
      <!-- 2.2 場景horse -->
      <a-entity gltf-model="#horse" position="-25 0 -7" scale="3 3 3" ></a-entity>
      <!-- 2.3 場景frozen -->
      <a-entity gltf-model="#frozen" position="90 -18 -25" scale="50 50 50" ></a-entity>
      <a-entity gltf-model="#frozen" position="90 -18 24.8" scale="50 50 50" rotation="0 180 0"></a-entity>
      <!-- 2.4 場景forest -->
      <a-entity gltf-model="#forest" position="0 -10 0" scale="0.1 0.1 0.1" ></a-entity>
      <a-entity gltf-model="#forest" position="85 -10 60" scale="0.1 0.1 0.1" rotation="0 90 0"></a-entity>
      <a-entity gltf-model="#forest" position="-35 0 90" scale="0.1 0.1 0.1" rotation="0 90 0"></a-entity>
      <a-entity gltf-model="#forest" position="-35 -10 120" scale="0.1 0.1 0.1" rotation="0 90 0"></a-entity>
      <a-entity gltf-model="#forest" position="-55 5D 180" scale="0.1 0.1 0.1" rotation="0 135 0"></a-entity>
      <a-entity gltf-model="#forest" position="-75 10 90" scale="0.1 0.1 0.1" rotation="0 90 0"></a-entity>
      <a-entity gltf-model="#forest" position="15 -5 87" scale="0.1 0.1 0.1" rotation="0 90 0"></a-entity>
      <a-entity gltf-model="#forest" position="-35 0 60" scale="0.1 0.1 0.1" rotation="0 90 0"></a-entity>
      <a-entity gltf-model="#forest" position="-45 -5 30" scale="0.1 0.1 0.1" rotation="0 45 0"></a-entity>
      <a-entity gltf-model="#forest" position="-95 0 -30" scale="0.1 0.1 0.1" rotation="0 0 0"></a-entity>
      <!-- 2.5 場景village -->
      <a-entity gltf-model="#village" position="0 -25 -250" scale="1 1 1" rotation="0 0 0"></a-entity>
      <!-- 2.6 場景lake -->
      <a-entity gltf-model="#lake" position="75 -5 60" scale="10 10 10" rotation="0 0 0"></a-entity>
      <a-entity gltf-model="#lake2" position="15 -17 35" scale="3 3 3" rotation="0 0 0"></a-entity>
      <!-- 背景 background-->
      <a-sky src="/assets/1.jpg"></a-sky>     

      <!-- 燈光設定 light setting-->
      <a-entity light="type: point; intensity: 6.0; distance: 20; decay: 2" position="1.5 3 5"></a-entity>      
            
    </a-scene>
  </body>
</html>
